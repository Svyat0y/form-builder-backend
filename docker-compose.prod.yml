services:
  postgres:
    image: postgres:15
    container_name: form-builder-db
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - form-builder-network

  app:
    image: ghcr.io/svyat0y/form-builder-backend:latest
    build: .
    container_name: form-builder-app
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - form-builder-network

volumes:
  postgres_data:
  uploads_data:

networks:
  form-builder-network:
    driver: bridge
